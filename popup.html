<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 290px;
      padding: 16px;
      background: #141518;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    .brand i {
      color: #1a73e8;
      font-size: 16px;
    }
    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #9aa0a6;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 12px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34a853;
    }
    .dot.recording {
      background: #ea4335;
      box-shadow: 0 0 8px #ea4335;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }
    .mode-label {
      font-size: 11px;
      font-weight: 600;
      color: #9aa0a6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: #1f2024;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 2px;
    }
    .mode-btn {
      padding: 7px 0;
      border: none;
      background: transparent;
      color: #9aa0a6;
      font-size: 11px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: #1a73e8;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.4);
    }
    .lang-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #1f2024;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: opacity 0.2s ease;
    }
    .lang-switcher.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .lang-btn {
      padding: 6px 0;
      border: none;
      background: transparent;
      color: #9aa0a6;
      font-size: 11px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #2b2d33;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .mic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0 14px;
    }
    .main-mic-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #25272d;
      border: 2px solid rgba(255, 255, 255, 0.12);
      color: #c4c7c5;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .main-mic-btn:hover {
      transform: scale(1.06);
      background: #2d3036;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .main-mic-btn.active {
      background: #ea4335;
      color: #ffffff;
      border-color: #ff7669;
      box-shadow: 0 0 22px rgba(234, 67, 53, 0.5);
    }
    .mic-status-label {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #c4c7c5;
    }
    .footer-shortcuts {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
      color: #9aa0a6;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    kbd {
      background: #2b2d33;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <i class="fa-solid fa-microphone-lines"></i>
      <span>Voice</span>
    </div>
    <div class="status-dot">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>
  </div>

  <div class="mode-label">
    <i class="fa-solid fa-sliders"></i>
    <span>Mode</span>
  </div>

  <div class="mode-switcher">
    <button type="button" class="mode-btn active" id="modeNormal" data-mode="normal" title="Normal Voice Typing">
      <i class="fa-solid fa-pen-nib"></i>
      <span>Normal</span>
    </button>
    <button type="button" class="mode-btn" id="modeBnToEn" data-mode="bn_to_en" title="Speak Bangla, Type English">
      <span>বাংলা ➔ EN</span>
    </button>
    <button type="button" class="mode-btn" id="modeEnToBn" data-mode="en_to_bn" title="Speak English, Type Bangla">
      <span>EN ➔ বাংলা</span>
    </button>
  </div>

  <div class="lang-switcher" id="normalLangGroup">
    <button type="button" class="lang-btn active" id="btnBangla" data-lang="bn-BD">
      <i class="fa-solid fa-language"></i>
      <span>বাংলা</span>
    </button>
    <button type="button" class="lang-btn" id="btnEnglish" data-lang="en-US">
      <i class="fa-solid fa-globe"></i>
      <span>English</span>
    </button>
  </div>

  <div class="mic-container">
    <button type="button" class="main-mic-btn" id="mainMicBtn" title="Click to Toggle Voice Typing">
      <i class="fa-solid fa-microphone"></i>
    </button>
    <div class="mic-status-label" id="micActionText">Click to Speak</div>
  </div>

  <div class="footer-shortcuts">
    <div class="shortcut-row">
      <span>Voice Typing:</span>
      <div><kbd>Alt</kbd> + <kbd>V</kbd></div>
    </div>
    <div class="shortcut-row">
      <span>Switch Mode / Lang:</span>
      <div><kbd>Alt</kbd> + <kbd>L</kbd></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
